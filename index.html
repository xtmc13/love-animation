<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级爱心特效</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas { display: block; }
        .love-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff69b4, 0 0 60px #ff1493;
            pointer-events: none;
            animation: textGlow 2s ease-in-out infinite;
            white-space: nowrap;
        }
        @keyframes textGlow {
            0%, 100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }
        .hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="love-text">王乐君 ❤️ 我爱你 ❤️</div>
    <div class="hint">点击屏幕释放爱心 💕</div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let mouseParticles = [];
        let centerHeart = { scale: 1, rotation: 0 };
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        // 粒子类
        class Particle {
            constructor(x, y, isMouse = false) {
                this.x = x || Math.random() * width;
                this.y = y || height + 50;
                this.isMouse = isMouse;
                
                if (isMouse) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 8 + 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed - 3;
                    this.size = Math.random() * 15 + 8;
                    this.life = 1;
                    this.decay = Math.random() * 0.02 + 0.01;
                } else {
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = -(Math.random() * 3 + 1);
                    this.size = Math.random() * 25 + 10;
                }
                
                this.hue = Math.random() * 40 + 320; // 粉色到红色
                this.saturation = 100;
                this.lightness = 70;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.1 + 0.02;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 0.5;
                this.rotation += this.rotationSpeed;
                
                if (this.isMouse) {
                    this.vy += 0.1; // 重力
                    this.life -= this.decay;
                }
                
                // 边界检查
                if (this.y < -50 || this.x < -50 || this.x > width + 50 || this.life <= 0) {
                    if (this.isMouse) {
                        return false;
                    } else {
                        this.reset();
                    }
                }
                return true;
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = height + 50;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = -(Math.random() * 3 + 1);
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                const alpha = this.isMouse ? this.life : (1 - (this.y / height) * 0.5);
                ctx.globalAlpha = Math.max(0, alpha);
                
                // 渐变色
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                gradient.addColorStop(0, `hsl(${this.hue}, ${this.saturation}%, 80%)`);
                gradient.addColorStop(0.5, `hsl(${this.hue}, ${this.saturation}%, ${this.lightness}%)`);
                gradient.addColorStop(1, `hsl(${this.hue}, ${this.saturation}%, 50%)`);
                
                ctx.fillStyle = gradient;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;
                ctx.shadowBlur = 15;
                
                // 绘制爱心
                ctx.beginPath();
                const s = this.size / 20;
                ctx.scale(s, s);
                ctx.moveTo(0, -5);
                ctx.bezierCurveTo(0, -15, -15, -15, -15, -5);
                ctx.bezierCurveTo(-15, 5, 0, 15, 0, 25);
                ctx.bezierCurveTo(0, 15, 15, 5, 15, -5);
                ctx.bezierCurveTo(15, -15, 0, -15, 0, -5);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // 初始化粒子
        for (let i = 0; i < 60; i++) {
            const p = new Particle();
            p.y = Math.random() * height;
            particles.push(p);
        }
        
        // 中央3D爱心
        function drawCenterHeart() {
            const cx = width / 2;
            const cy = height / 2;
            const time = Date.now() * 0.001;
            
            centerHeart.scale = 1 + Math.sin(time * 2) * 0.08;
            centerHeart.rotation += 0.01;
            
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(centerHeart.scale, centerHeart.scale);
            ctx.rotate(Math.sin(time) * 0.1);
            
            // 外发光
            for (let i = 3; i >= 0; i--) {
                const glowSize = 150 + i * 30;
                const alpha = 0.15 - i * 0.03;
                ctx.beginPath();
                ctx.fillStyle = `rgba(255, 105, 180, ${alpha})`;
                ctx.shadowColor = '#ff69b4';
                ctx.shadowBlur = 50;
                drawHeartPath(ctx, glowSize);
                ctx.fill();
            }
            
            // 主爱心
            const gradient = ctx.createRadialGradient(0, -20, 0, 0, 0, 120);
            gradient.addColorStop(0, '#ffb6c1');
            gradient.addColorStop(0.3, '#ff69b4');
            gradient.addColorStop(0.7, '#ff1493');
            gradient.addColorStop(1, '#db7093');
            
            ctx.fillStyle = gradient;
            ctx.shadowColor = '#ff1493';
            ctx.shadowBlur = 40;
            drawHeartPath(ctx, 100);
            ctx.fill();
            
            // 高光
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.ellipse(-20, -40, 15, 8, -0.3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawHeartPath(ctx, size) {
            const s = size / 100;
            ctx.beginPath();
            ctx.moveTo(0, -30 * s);
            ctx.bezierCurveTo(0, -80 * s, -80 * s, -80 * s, -80 * s, -30 * s);
            ctx.bezierCurveTo(-80 * s, 20 * s, 0, 80 * s, 0, 120 * s);
            ctx.bezierCurveTo(0, 80 * s, 80 * s, 20 * s, 80 * s, -30 * s);
            ctx.bezierCurveTo(80 * s, -80 * s, 0, -80 * s, 0, -30 * s);
            ctx.closePath();
        }
        
        // 星星背景
        const stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * 2000,
                y: Math.random() * 2000,
                size: Math.random() * 2 + 0.5,
                twinkle: Math.random() * Math.PI * 2
            });
        }
        
        function drawStars() {
            const time = Date.now() * 0.001;
            stars.forEach(star => {
                const alpha = 0.3 + Math.sin(time + star.twinkle) * 0.3;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(star.x % width, star.y % height, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        // 动画循环
        function animate() {
            // 拖尾效果
            ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
            ctx.fillRect(0, 0, width, height);
            
            drawStars();
            
            // 更新和绘制粒子
            particles = particles.filter(p => p.update());
            particles.forEach(p => p.draw());
            
            // 鼠标点击粒子
            mouseParticles = mouseParticles.filter(p => p.update());
            mouseParticles.forEach(p => p.draw());
            
            drawCenterHeart();
            
            requestAnimationFrame(animate);
        }
        
        // 点击事件
        document.addEventListener('click', (e) => {
            for (let i = 0; i < 15; i++) {
                mouseParticles.push(new Particle(e.clientX, e.clientY, true));
            }
        });
        
        // 触摸事件
        document.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            for (let i = 0; i < 15; i++) {
                mouseParticles.push(new Particle(touch.clientX, touch.clientY, true));
            }
        });
        
        animate();
    </script>
</body>
</html>
