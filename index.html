<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱心窗口</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            overflow: hidden;
            font-family: '微软雅黑', sans-serif;
        }
        .heart-window {
            position: absolute;
            width: 120px;
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: popIn 0.5s ease-out forwards;
            opacity: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .heart-window:hover {
            transform: scale(1.1);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }
        .hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            pointer-events: none;
        }
        .close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .close-btn:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <button class="close-btn" onclick="closeAll()">按空格关闭</button>
    <div class="hint">点击任意窗口或按空格键关闭 ❤️</div>
    
    <script>
        const tips = ['多喝水哦~', '好好爱自己', '好好吃饭', '保持好心情', '我想你了', '顺顺利利', '别熬夜', '天冷了多穿衣服', '要开心哦', '注意休息'];
        const colors = ['#FFB6C1', '#87CEEB', '#90EE90', '#FFFACD', '#FF69B4', '#ADD8E6', '#FFA07A', '#98FB98', '#DDA0DD', '#F0E68C'];
        const windows = [];
        
        // 爱心参数方程
        function heartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x, y };
        }
        
        // 生成爱心形状的点
        function generateHeartPoints(n) {
            const points = [];
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const scale = Math.min(window.innerWidth, window.innerHeight) / 45;
            
            for (let i = 0; i < n; i++) {
                const t = (i / n) * 2 * Math.PI;
                const { x, y } = heartPoint(t);
                points.push({
                    x: centerX + x * scale - 60,
                    y: centerY - y * scale - 25
                });
            }
            return points;
        }
        
        // 创建窗口
        function createWindow(x, y, tip, isLast = false) {
            const div = document.createElement('div');
            div.className = 'heart-window';
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            div.style.background = isLast ? 'linear-gradient(135deg, #FF69B4, #FF1493)' : colors[Math.floor(Math.random() * colors.length)];
            div.style.color = isLast ? 'white' : '#333';
            div.style.width = isLast ? '160px' : '120px';
            div.style.fontSize = isLast ? '16px' : '14px';
            div.textContent = tip;
            div.style.animationDelay = Math.random() * 0.5 + 's';
            
            div.addEventListener('click', () => {
                div.style.animation = 'none';
                div.style.opacity = '0';
                div.style.transform = 'scale(0)';
                setTimeout(() => div.remove(), 300);
            });
            
            document.body.appendChild(div);
            return div;
        }
        
        // 初始化
        function init() {
            const n = 80; // 窗口数量
            const points = generateHeartPoints(n);
            
            points.forEach((point, i) => {
                const isLast = i === n - 1;
                const tip = isLast ? '王乐君 ❤️ 我爱你' : tips[Math.floor(Math.random() * tips.length)];
                setTimeout(() => {
                    const w = createWindow(point.x, point.y, tip, isLast);
                    windows.push(w);
                }, i * 30); // 依次出现
            });
        }
        
        // 关闭所有窗口
        function closeAll() {
            windows.forEach((w, i) => {
                setTimeout(() => {
                    if (w.parentNode) {
                        w.style.opacity = '0';
                        w.style.transform = 'scale(0)';
                        setTimeout(() => w.remove(), 300);
                    }
                }, i * 20);
            });
        }
        
        // 空格键关闭
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                closeAll();
            }
        });
        
        // 窗口大小改变时重新生成
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                windows.forEach(w => w.remove());
                windows.length = 0;
                init();
            }, 500);
        });
        
        init();
    </script>
</body>
</html>
